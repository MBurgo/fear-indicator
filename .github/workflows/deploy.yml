name: Update ASX Drivers Index data

# Daily (weekday) refresh of the index data. The compute runs here in Python;
# the resulting web/data.json is committed back to the repo, and Cloudflare Pages
# (connected to this repo, serving the web/ directory) auto-deploys on the push.
#
# Scheduled workflows run from the default branch. The first run does a full ASIC
# backfill (~10-15 min); later runs restore the cache and fetch only new days.
# Pushes made with GITHUB_TOKEN do not re-trigger workflows, so there is no loop.

on:
  schedule:
    # 09:00 UTC on weekdays (~19:00-20:00 AEST/AEDT), after the AU close and the
    # RBA's next-day publication. Adjust to taste.
    - cron: "0 9 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: asx-drivers-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Cache ASIC short-position files
        uses: actions/cache@v4
        with:
          path: data/asic
          key: asic-${{ github.run_id }}
          restore-keys: |
            asic-

      - name: Fetch ASIC short positions (incremental, resumable)
        run: asx-fetch-asic --out data/asic --start 2016-01-01

      - name: Compute index -> web/data.json
        run: asx-drivers --source live --asic-dir data/asic --json web/data.json

      - name: Commit updated data
        run: |
          git config user.name "asx-drivers-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f web/data.json
          if git diff --staged --quiet; then
            echo "No data change."
          else
            git commit -m "chore: update index data $(date -u +%F)"
            git push
          fi
