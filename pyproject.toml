[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asx-mood-index"
version = "0.1.0"
description = "A Fear & Greed-style market sentiment gauge for the Australian market (ASX)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
asx-mood = "asx_mood.cli:main"
asx-drivers = "asx_drivers.cli:main"
asx-fetch-asic = "asx_drivers.fetch_asic:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
