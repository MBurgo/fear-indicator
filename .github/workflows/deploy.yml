name: Update & deploy ASX Drivers Index

# Runs daily on weekdays (and on demand) to refresh the index data and publish
# the static dashboard to GitHub Pages.
#
# One-time setup:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
#
# Scheduled runs only fire from the repository's default branch, so this takes
# effect once merged there. The first run does a full ASIC backfill (~10-15 min);
# later runs restore the cache and fetch only the new days.

on:
  schedule:
    # 09:00 UTC on weekdays (~19:00-20:00 AEST/AEDT) - after the AU close and the
    # RBA's next-day publication. Adjust to taste.
    - cron: "0 9 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: asx-drivers-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Cache ASIC short-position files
        uses: actions/cache@v4
        with:
          path: data/asic
          # Unique key each run saves a fresh (growing) cache; restore-keys pulls
          # the most recent prior cache so the fetch is incremental.
          key: asic-${{ github.run_id }}
          restore-keys: |
            asic-

      - name: Fetch ASIC short positions (incremental, resumable)
        run: asx-fetch-asic --out data/asic --start 2016-01-01

      - name: Compute index -> web/data.json
        run: asx-drivers --source live --asic-dir data/asic --json web/data.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
